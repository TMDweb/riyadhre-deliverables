<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RiyadhRe — عيد أضحى مبارك ٢٠٢٦</title>
<meta name="description" content="بطاقة تهنئة عيد الأضحى المبارك من الرياض لإعادة التأمين — اختر التصميم، أضف اسمك، وحمّل البطاقة">

<!-- ABC Favorit Arabic — local self-hosted -->
<style>
  @font-face {
    font-family: 'ABC Favorit Arabic';
    src: url('fonts/ABCFavoritArabic-Light-Trial.otf') format('opentype');
    font-weight: 300;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'ABC Favorit Arabic';
    src: url('fonts/ABCFavoritArabic-Book-Trial.otf') format('opentype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'ABC Favorit Arabic';
    src: url('fonts/ABCFavoritArabic-Regular-Trial.otf') format('opentype');
    font-weight: 450;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'ABC Favorit Arabic';
    src: url('fonts/ABCFavoritArabic-Medium-Trial.otf') format('opentype');
    font-weight: 500;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'ABC Favorit Arabic';
    src: url('fonts/ABCFavoritArabic-Bold-Trial.otf') format('opentype');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --green: #024941;
    --green-deep: #01362f;
    --orange: #FB6A07;
    --dark-brown: #503E32;
    --dark-sand: #E4BB90;
    --light-brown: #8E6846;
    --light-sand: #EDD3BC;
    --cream: #FDFAF7;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    font-family: 'ABC Favorit Arabic', system-ui, sans-serif;
    background: var(--light-sand);
    color: var(--green);
    min-height: 100vh;
  }

  /* Header */
  .header {
    background: var(--green);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .brand-mark {
    color: var(--light-sand);
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.5px;
    line-height: 1;
  }
  .brand-mark small {
    display: block;
    font-weight: 400;
    font-size: 11px;
    letter-spacing: 1px;
    opacity: 0.7;
    margin-top: 4px;
  }
  .header-tag {
    color: var(--dark-sand);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.5px;
  }

  /* Main container */
  .container {
    max-width: 1180px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  .page-title {
    text-align: center;
    margin-bottom: 10px;
    font-size: 40px;
    font-weight: 700;
    color: var(--green);
    line-height: 1.15;
  }
  .page-subtitle {
    text-align: center;
    margin-bottom: 48px;
    font-size: 16px;
    color: var(--dark-brown);
    opacity: 0.85;
    font-weight: 400;
  }

  /* Step label */
  .step-label {
    display: inline-block;
    background: var(--green);
    color: var(--cream);
    font-size: 13px;
    font-weight: 700;
    padding: 6px 18px;
    border-radius: 999px;
    margin-bottom: 18px;
    letter-spacing: 0.3px;
  }

  /* Design grid */
  .designs-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-bottom: 56px;
  }
  @media (max-width: 720px) {
    .designs-grid { grid-template-columns: 1fr; max-width: 360px; margin-left: auto; margin-right: auto; }
  }
  .design-card {
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    border: 3px solid transparent;
    position: relative;
    aspect-ratio: 3 / 4;
    background: #ddd;
  }
  .design-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 14px 36px rgba(2,73,65,0.18);
  }
  .design-card.selected {
    border-color: var(--orange);
    box-shadow: 0 0 0 2px var(--orange);
  }
  .design-card .check-badge {
    position: absolute;
    top: 12px;
    inset-inline-start: 12px;
    width: 30px;
    height: 30px;
    background: var(--orange);
    border-radius: 50%;
    display: none;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 16px;
    font-weight: 700;
    z-index: 2;
  }
  .design-card.selected .check-badge { display: flex; }
  .design-card img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
  }

  /* Form section */
  .form-section {
    background: var(--cream);
    border-radius: 18px;
    padding: 32px;
    margin-bottom: 56px;
    box-shadow: 0 4px 24px rgba(2,73,65,0.08);
  }
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }
  @media (max-width: 640px) {
    .form-row { grid-template-columns: 1fr; }
  }
  .form-group label {
    display: block;
    font-size: 14px;
    font-weight: 700;
    color: var(--green);
    margin-bottom: 8px;
  }
  .form-group .hint {
    font-weight: 400;
    color: var(--light-brown);
    font-size: 12px;
    margin-inline-start: 6px;
  }
  .form-group input {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid var(--dark-sand);
    border-radius: 10px;
    font-family: 'ABC Favorit Arabic', system-ui, sans-serif;
    font-size: 16px;
    color: var(--dark-brown);
    background: #fff;
    transition: border-color 0.2s ease;
  }
  .form-group input.ar { direction: rtl; text-align: right; }
  .form-group input.en { direction: ltr; text-align: left; }
  .form-group input:focus {
    outline: none;
    border-color: var(--green);
  }
  .form-group input::placeholder {
    color: var(--light-brown);
    opacity: 0.55;
  }

  /* Preview section */
  .preview-section {
    text-align: center;
    margin-bottom: 24px;
  }
  .preview-wrapper {
    display: inline-block;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 10px 44px rgba(2,73,65,0.18);
    max-width: 420px;
    width: 100%;
    background: var(--green);
  }
  .preview-wrapper canvas {
    display: block;
    width: 100%;
    height: auto;
  }

  /* Buttons */
  .actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin-top: 28px;
  }
  .download-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--green);
    color: var(--cream);
    border: none;
    padding: 16px 44px;
    font-family: 'ABC Favorit Arabic', system-ui, sans-serif;
    font-size: 17px;
    font-weight: 700;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.1s ease;
    letter-spacing: 0.3px;
  }
  .download-btn:hover { background: var(--green-deep); }
  .download-btn:active { transform: scale(0.97); }
  .download-btn svg { width: 20px; height: 20px; }

  .secondary-btn {
    background: none;
    border: none;
    color: var(--light-brown);
    font-family: 'ABC Favorit Arabic', system-ui, sans-serif;
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .secondary-btn:hover { color: var(--green); }

  /* Footer */
  .footer {
    background: var(--green);
    color: var(--dark-sand);
    text-align: center;
    padding: 24px;
    font-size: 13px;
  }
  .footer a {
    color: var(--dark-sand);
    text-decoration: none;
    border-bottom: 1px dashed rgba(228,187,144,0.5);
  }

  #exportCanvas { display: none; }
</style>
</head>
<body>

<div class="header">
  <div class="brand-mark">
    RiyadhRe
    <small>الرياض لإعادة التأمين</small>
  </div>
  <span class="header-tag">عيد أضحى مبارك ١٤٤٦ / ٢٠٢٦</span>
</div>

<div class="container">

  <h1 class="page-title">عيدكم مبارك</h1>
  <p class="page-subtitle">اختر التصميم، أضف اسمك، وحمّل بطاقة المعايدة الخاصة بك</p>

  <!-- Step 1: Choose Design -->
  <div class="step-label">١ &nbsp;·&nbsp; اختر التصميم</div>
  <div class="designs-grid" id="designsGrid">
    <div class="design-card selected" data-design="0" onclick="selectDesign(0)">
      <div class="check-badge">&#10003;</div>
      <img src="eid01.png" alt="تصميم 1" loading="eager">
    </div>
    <div class="design-card" data-design="1" onclick="selectDesign(1)">
      <div class="check-badge">&#10003;</div>
      <img src="eid02.png" alt="تصميم 2" loading="eager">
    </div>
    <div class="design-card" data-design="2" onclick="selectDesign(2)">
      <div class="check-badge">&#10003;</div>
      <img src="eid03.png" alt="تصميم 3" loading="eager">
    </div>
  </div>

  <!-- Step 2: Enter Name -->
  <div class="step-label">٢ &nbsp;·&nbsp; أضف اسمك</div>
  <div class="form-section">
    <div class="form-row">
      <div class="form-group">
        <label>الاسم بالعربية <span class="hint">(اختياري)</span></label>
        <input type="text" id="nameAr" class="ar" placeholder="مثال: محمد العتيبي" oninput="updatePreview()" maxlength="60" autocomplete="off">
      </div>
      <div class="form-group">
        <label>Name in English <span class="hint">(optional)</span></label>
        <input type="text" id="nameEn" class="en" placeholder="e.g. Mohammed Al-Otaibi" oninput="updatePreview()" maxlength="60" autocomplete="off">
      </div>
    </div>
  </div>

  <!-- Step 3: Preview & Download -->
  <div class="step-label">٣ &nbsp;·&nbsp; معاينة وتحميل</div>
  <div class="preview-section">
    <div class="preview-wrapper">
      <canvas id="previewCanvas" width="1080" height="1640"></canvas>
    </div>
    <div class="actions">
      <button class="download-btn" onclick="downloadCard()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        تحميل البطاقة
      </button>
      <button class="secondary-btn" onclick="openCardInNewTab()">لم يعمل التحميل؟ افتح الصورة في نافذة جديدة</button>
    </div>
  </div>

</div>

<div class="footer">
  RiyadhRe © 2026 — الرياض لإعادة التأمين
</div>

<!-- Hidden export canvas (full resolution 1080 x 1640) -->
<canvas id="exportCanvas" width="1080" height="1640"></canvas>

<script>
// ──────────────────────────────────────────────
// State
// ──────────────────────────────────────────────
let selectedDesign = 0;

// Source images are 1080 x 1440. We render onto a 1080 x 1640 canvas
// — the extra 200px is a brand-green strip at the bottom holding the name.
const IMG_W = 1080;
const IMG_H = 1440;
const STRIP_H = 200;
const CANVAS_W = IMG_W;
const CANVAS_H = IMG_H + STRIP_H; // 1640

const designs = [
  { src: 'eid01.png', img: new Image() },
  { src: 'eid02.png', img: new Image() },
  { src: 'eid03.png', img: new Image() }
];

let loadedCount = 0;
designs.forEach((d, i) => {
  d.img.crossOrigin = 'anonymous';
  d.img.onload = () => {
    loadedCount++;
    if (loadedCount === designs.length) updatePreview();
  };
  d.img.onerror = () => {
    console.warn('Failed to load', d.src);
    loadedCount++;
    if (loadedCount === designs.length) updatePreview();
  };
  d.img.src = d.src;
});

// ──────────────────────────────────────────────
// Card renderer
// Draws the chosen design at the top (1080x1440)
// then a 1080x200 brand strip below containing the name.
// ──────────────────────────────────────────────
function renderCard(ctx, nameAr, nameEn) {
  // Background fill (covers any gaps while image loads)
  ctx.fillStyle = '#024941';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  // Draw the source artwork (1080x1440) on top
  const d = designs[selectedDesign];
  if (d.img.complete && d.img.naturalWidth > 0) {
    ctx.drawImage(d.img, 0, 0, IMG_W, IMG_H);
  }

  // Brand strip background
  const stripY = IMG_H;
  ctx.fillStyle = '#024941';
  ctx.fillRect(0, stripY, CANVAS_W, STRIP_H);

  // Subtle gold hairline at the top of the strip
  ctx.fillStyle = '#E4BB90';
  ctx.fillRect(0, stripY, CANVAS_W, 2);

  // Decorative diamond centered on the hairline
  ctx.save();
  ctx.translate(CANVAS_W / 2, stripY + 1);
  ctx.rotate(Math.PI / 4);
  ctx.fillRect(-7, -7, 14, 14);
  ctx.restore();

  // ── Name typography ─────────────────────────
  // Layout depends on which fields are filled:
  //   both → AR on top (large), EN below (smaller)
  //   AR only → AR centered, larger
  //   EN only → EN centered, larger
  //   neither → soft hint "من / From"
  const hasAr = !!nameAr;
  const hasEn = !!nameEn;
  const cx = CANVAS_W / 2;
  const stripCy = stripY + STRIP_H / 2;

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  if (hasAr && hasEn) {
    // Two-line layout
    ctx.fillStyle = '#FDFAF7';
    ctx.font = '700 62px "ABC Favorit Arabic", system-ui, sans-serif';
    ctx.direction = 'rtl';
    ctx.fillText(nameAr, cx, stripCy - 32);

    ctx.fillStyle = '#E4BB90';
    ctx.font = '500 38px "ABC Favorit Arabic", system-ui, sans-serif';
    ctx.direction = 'ltr';
    ctx.fillText(nameEn, cx, stripCy + 38);
  } else if (hasAr) {
    ctx.fillStyle = '#FDFAF7';
    ctx.font = '700 72px "ABC Favorit Arabic", system-ui, sans-serif';
    ctx.direction = 'rtl';
    ctx.fillText(nameAr, cx, stripCy + 6);
  } else if (hasEn) {
    ctx.fillStyle = '#FDFAF7';
    ctx.font = '700 60px "ABC Favorit Arabic", system-ui, sans-serif';
    ctx.direction = 'ltr';
    ctx.fillText(nameEn, cx, stripCy + 6);
  } else {
    // Empty hint
    ctx.fillStyle = 'rgba(228,187,144,0.55)';
    ctx.font = '400 28px "ABC Favorit Arabic", system-ui, sans-serif';
    ctx.direction = 'rtl';
    ctx.fillText('— أضف اسمك هنا / Your name here —', cx, stripCy + 6);
  }
}

// ──────────────────────────────────────────────
// Selection
// ──────────────────────────────────────────────
function selectDesign(idx) {
  selectedDesign = idx;
  document.querySelectorAll('.design-card').forEach((c, i) => {
    c.classList.toggle('selected', i === idx);
  });
  updatePreview();
}

// ──────────────────────────────────────────────
// Preview render
// ──────────────────────────────────────────────
function updatePreview() {
  const nameAr = document.getElementById('nameAr').value.trim();
  const nameEn = document.getElementById('nameEn').value.trim();
  const c = document.getElementById('previewCanvas');
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);
  renderCard(ctx, nameAr, nameEn);
}

// ──────────────────────────────────────────────
// Download
// ──────────────────────────────────────────────
function buildFilename() {
  const nameEn = document.getElementById('nameEn').value.trim();
  const slug = nameEn
    ? nameEn.replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40)
    : '';
  return slug
    ? `RiyadhRe-EidAdha-2026-${slug}.png`
    : 'RiyadhRe-EidAdha-2026.png';
}

function downloadCard() {
  const nameAr = document.getElementById('nameAr').value.trim();
  const nameEn = document.getElementById('nameEn').value.trim();
  const c = document.getElementById('exportCanvas');
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);
  renderCard(ctx, nameAr, nameEn);

  const dataUrl = c.toDataURL('image/png');
  const link = document.createElement('a');
  link.style.display = 'none';
  link.download = buildFilename();
  link.href = dataUrl;
  document.body.appendChild(link);
  link.click();
  setTimeout(() => document.body.removeChild(link), 100);
}

function openCardInNewTab() {
  const nameAr = document.getElementById('nameAr').value.trim();
  const nameEn = document.getElementById('nameEn').value.trim();
  const c = document.getElementById('exportCanvas');
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);
  renderCard(ctx, nameAr, nameEn);

  const dataUrl = c.toDataURL('image/png');
  const w = window.open('');
  if (w) {
    w.document.write(
      '<html><head><title>RiyadhRe — Eid Adha 2026</title></head>' +
      '<body style="margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh;background:#024941">' +
      '<img src="' + dataUrl + '" style="max-width:100%;max-height:100vh">' +
      '</body></html>'
    );
    w.document.close();
  }
}

// ──────────────────────────────────────────────
// Re-render once fonts are ready (so the strip text uses ABC Favorit Arabic, not the fallback)
// ──────────────────────────────────────────────
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(updatePreview);
}

// Initial paint (fallback font, will be replaced once fonts.ready resolves)
updatePreview();
</script>

</body>
</html>
